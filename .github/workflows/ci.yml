name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR runs supersede each other; a push to main is never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff, ruff-format, codespell, gitleaks, markdownlint-cli2, yamllint, actionlint,
  # file hygiene.
  # Tool versions live in .pre-commit-config.yaml only.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks-history scans every commit
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      # the commit-stage gitleaks hook only sees staged changes; scan the whole
      # tree and every commit (a secret committed then deleted stays in history)
      - run: pre-commit run --hook-stage manual gitleaks-dir --all-files
      - run: pre-commit run --hook-stage manual gitleaks-history --all-files

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]" types-PyYAML
      - run: mypy vedirect_influx

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=vedirect_influx --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # smoke test: the built wheel installs into a clean venv and the entry point runs
      - name: Smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/vedirect-influx" --help

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Per-PR: internal links only (offline) so a flaky external host never blocks a PR.
      # External links are checked weekly by links-external.yml.
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --offline --no-progress
            './**/*.md'
          fail: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      # Audit the project's own dependency tree (runtime + the `ble` extra; not `vcr`, which
      # needs system libs). Same audit as security-weekly.yml.
      - name: Resolve project dependencies
        run: |
          python -m venv "$RUNNER_TEMP/proj"
          "$RUNNER_TEMP/proj/bin/pip" install ".[ble]"
          "$RUNNER_TEMP/proj/bin/pip" freeze --exclude-editable | grep -v '^vedirect-influx' > "$RUNNER_TEMP/audit-reqs.txt"
          cat "$RUNNER_TEMP/audit-reqs.txt"
      - run: pip install pip-audit
      - run: pip-audit -r "$RUNNER_TEMP/audit-reqs.txt" --no-deps --disable-pip
