name: security-weekly
# Weekly dependency audit: catches new advisories between PRs. Same audit as the
# `security` job in ci.yml.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Resolve project dependencies
        run: |
          python -m venv "$RUNNER_TEMP/proj"
          "$RUNNER_TEMP/proj/bin/pip" install ".[ble]"
          "$RUNNER_TEMP/proj/bin/pip" freeze --exclude-editable | grep -v '^vedirect-influx' > "$RUNNER_TEMP/audit-reqs.txt"
      - run: pip install pip-audit
      - run: pip-audit -r "$RUNNER_TEMP/audit-reqs.txt" --no-deps --disable-pip
